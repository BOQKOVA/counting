<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Count Gym · Russian numbers & nouns A1–A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Golos+Text:wght@400..900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#fffaf7; --surface:#fff; --ink:#0d0d0d; --muted:#4d4a4b;
  --pink:#fe98c0; --green:#80eb3d; --blue:#3dd0eb; --red:#eb583d;
  --yellow:#ffe14d; --lilac:#c4a5ff;
  --border:3px solid var(--ink); --radius:18px;
  --shadow:6px 6px 0 var(--ink); --shadow-sm:4px 4px 0 var(--ink); --shadow-lg:9px 9px 0 var(--ink);
  --font-display:"Bricolage Grotesque","Golos Text","Arial Black",system-ui,sans-serif;
  --font-ru:"Golos Text",system-ui,sans-serif;
  --font-body:"DM Sans","Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --max:1120px; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.05rem;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--pink)}
a{color:inherit}
button,select{font:inherit;color:inherit}
.container{max-width:var(--max);margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.ru{font-family:var(--font-ru)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border:var(--border);border-radius:999px;background:var(--pink);font-family:var(--font-display);font-size:1rem;font-weight:800;text-decoration:none;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn--ghost{background:var(--surface)} .btn--green{background:var(--green)} .btn--blue{background:var(--blue)} .btn--red{background:var(--red)} .btn--yellow{background:var(--yellow)}
.btn--sm{padding:6px 14px;font-size:.9rem;box-shadow:3px 3px 0 var(--ink)}
.btn:focus-visible,.nav__link:focus-visible,.tile:focus-visible,.choice:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
.icon-btn{border:2px solid var(--ink);border-radius:999px;background:var(--surface);width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;font-size:1rem;box-shadow:2px 2px 0 var(--ink)}

.header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:var(--border)}
.header__inner{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;min-height:68px;padding-block:10px;flex-wrap:wrap}
.brand{padding:4px 12px;border:var(--border);border-radius:10px;background:var(--green);box-shadow:var(--shadow-sm);font-family:var(--font-display);font-size:1.15rem;font-weight:800;letter-spacing:-.02em;text-decoration:none;transform:rotate(-2deg);white-space:nowrap}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav__link{padding:5px 11px;border:2px solid transparent;border-radius:999px;font-weight:700;text-decoration:none;font-size:.93rem;transition:background .12s,border-color .12s}
.nav__link:hover{background:var(--surface);border-color:var(--ink)}
.nav__link.is-active{background:var(--ink);color:var(--bg)}
.header__tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;font-weight:800;font-family:var(--font-display);cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.is-on{background:var(--blue)}
.topic-select{padding:6px 12px;border:var(--border);border-radius:999px;background:var(--surface);font-weight:700;cursor:pointer;max-width:200px}
.xp{padding:5px 12px;border:var(--border);border-radius:999px;background:var(--pink);font-family:var(--font-display);font-weight:800;box-shadow:3px 3px 0 var(--ink);transform:rotate(3deg);white-space:nowrap}
.xp.bump{animation:bump .4s}
@keyframes bump{50%{transform:rotate(-4deg) scale(1.2)}}

.marquee{display:flex;overflow:hidden;border-block:var(--border);background:var(--ink);color:var(--green);font-family:var(--font-ru);font-size:clamp(1.1rem,3vw,1.6rem);font-weight:800;white-space:nowrap;user-select:none}
.marquee__track{display:flex;flex-shrink:0;align-items:center;gap:24px;padding:14px 12px;animation:marquee 45s linear infinite}
.marquee__star{color:var(--pink)}
@keyframes marquee{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.marquee__track{animation:none}html{scroll-behavior:auto}}

.section{padding:56px 0 72px}
.heading{margin:0 0 12px;font-family:var(--font-display);font-size:clamp(2.4rem,7vw,4.5rem);font-weight:800;line-height:.95;letter-spacing:-.04em}
.lead{margin:0 0 28px;font-size:1.15rem;font-weight:500;max-width:62ch}

.hero-wrap{padding:48px 0 64px}
.hero{display:flex;align-items:center;gap:56px;padding:40px;border:var(--border);border-radius:28px;background:var(--surface);box-shadow:var(--shadow-lg)}
.hero__media{position:relative;flex-shrink:0}
.hero__avatar{display:grid;place-items:center;width:240px;aspect-ratio:4/5;border:var(--border);border-radius:28px;background:linear-gradient(135deg,var(--green),var(--yellow));box-shadow:var(--shadow-lg);transform:rotate(-3deg);font-family:var(--font-ru);font-size:8.5rem;font-weight:900;line-height:1}
.hero__sticker{position:absolute;right:-26px;bottom:-20px;padding:9px 16px;border:var(--border);border-radius:999px;background:var(--pink);box-shadow:var(--shadow-sm);font-family:var(--font-display);font-size:1.1rem;font-weight:800;white-space:nowrap;transform:rotate(8deg)}
.hero__sticker2{position:absolute;left:-26px;top:-16px;padding:6px 14px;border:var(--border);border-radius:999px;background:var(--blue);box-shadow:var(--shadow-sm);font-family:var(--font-ru);font-weight:800;transform:rotate(-10deg);white-space:nowrap}
.hero__chip{display:inline-block;padding:3px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--pink);font-family:var(--font-display);font-weight:800;font-size:.85rem;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.hero__title{margin:14px 0 0;font-family:var(--font-display);font-size:clamp(5rem,17vw,11rem);font-weight:800;line-height:.8;letter-spacing:-.06em}
.hero__lead{max-width:34ch;margin:22px 0 0;font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:700;line-height:1.3}
.hero__stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{display:inline-block;padding:3px 13px;border:2px solid var(--ink);border-radius:999px;background:var(--blue);font-size:.92rem;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.mode{display:flex;flex-direction:column;border:var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--shadow);text-decoration:none;transition:transform .15s,box-shadow .15s}
.mode:hover{transform:translate(-3px,-3px) rotate(-1deg);box-shadow:var(--shadow-lg)}
.mode__banner{display:flex;align-items:flex-end;justify-content:space-between;min-height:130px;padding:16px 20px;border-bottom:var(--border);background:var(--c)}
.mode__emoji{font-size:2.6rem;line-height:1}
.mode__num{font-family:var(--font-display);font-weight:800;font-size:.9rem;border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:1px 10px}
.mode__body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.mode__title{margin:0;font-family:var(--font-display);font-size:1.75rem;font-weight:800;line-height:.95;letter-spacing:-.03em}
.mode__sum{margin:0;font-weight:500;flex:1}
.mode__go{font-family:var(--font-display);font-weight:800}

/* topics strip on home */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-bottom:56px}
.topic{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:var(--border);border-radius:16px;background:var(--c);box-shadow:var(--shadow-sm);cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s}
.topic:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:var(--shadow)}
.topic__e{font-size:1.8rem;line-height:1}
.topic__ru{font-family:var(--font-ru);font-weight:900;font-size:1.25rem;margin-top:6px}
.topic__en{font-weight:700;font-size:.9rem}

/* gender legend */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.g{display:inline-block;padding:1px 10px;border:2px solid var(--ink);border-radius:999px;font-weight:800;font-size:.8rem;background:var(--gc)}

/* noun list */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.search{flex:1 1 240px;padding:11px 18px;border:var(--border);border-radius:999px;font:inherit;font-weight:600;background:var(--surface);box-shadow:var(--shadow-sm);outline:none}
.search:focus{background:#fffbe0}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.tile{position:relative;text-align:left;padding:14px 16px;border:var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:3px}
.tile:hover{transform:translate(-2px,-2px) rotate(-.6deg);box-shadow:var(--shadow);background:var(--gc)}
.tile__e{font-size:2rem;line-height:1.1;min-height:2.2rem}
.tile__ru{font-family:var(--font-ru);font-weight:800;font-size:1.35rem;line-height:1.1}
.tile__en{font-weight:600;color:var(--muted);font-size:.92rem}
.tile:hover .tile__en{color:var(--ink)}
.tile__tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tile__star{position:absolute;top:10px;right:12px}
.groupsec{margin-bottom:44px}
.grouphead{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-family:var(--font-display);font-weight:800;font-size:1.8rem;letter-spacing:-.02em}
.grouphead .ru{font-weight:900}
.grouphead .badge{padding:2px 12px;border:var(--border);border-radius:12px;background:var(--c);box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:rgba(13,13,13,.45)}
.modal.is-open{display:grid}
.modal__box{position:relative;width:min(540px,100%);max-height:92vh;overflow:auto;border:var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-lg);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.9) rotate(-2deg);opacity:0}}
.modal__close{position:absolute;top:14px;right:14px}
.detail__head{padding:26px 28px 22px;border-bottom:var(--border);background:var(--gc)}
.detail__e{font-size:3.4rem;line-height:1}
.detail__ru{margin:8px 0 0;font-family:var(--font-ru);font-size:clamp(2.2rem,8vw,3.2rem);font-weight:900;line-height:1}
.detail__en{margin:6px 0 0;font-weight:700;font-size:1.15rem}
.detail__body{padding:22px 28px 28px;display:flex;flex-direction:column;gap:20px}
.label{font-family:var(--font-display);font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{padding:10px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--bg)}
.fact b{display:block;font-family:var(--font-ru);font-size:1.25rem}
.fact span{font-weight:700;color:var(--muted);font-size:.85rem}
.example{padding:14px 16px;border:2px dashed var(--ink);border-radius:14px;background:#fffbe0}
.example p{margin:0}
.example .ru{font-weight:700;font-size:1.15rem}
.note{padding:12px 16px;border:2px solid var(--ink);border-radius:14px;background:var(--lilac);font-weight:600}

/* games */
.game{max-width:760px;margin:0 auto}
.game__bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.progress{flex:1 1 200px;height:20px;border:var(--border);border-radius:999px;background:var(--surface);overflow:hidden}
.progress__fill{height:100%;background:var(--green);border-right:3px solid var(--ink);transition:width .3s;width:0}
.score{font-family:var(--font-display);font-weight:800;font-size:1.2rem;padding:4px 14px;border:var(--border);border-radius:999px;background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}
.stage{padding:32px;border:var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-lg);text-align:center}
.stage--pink{background:var(--pink)}
.bigword{font-family:var(--font-ru);font-weight:900;font-size:clamp(2.4rem,9vw,3.8rem);line-height:1;margin:6px 0}
.bigemoji{font-size:clamp(4rem,14vw,6rem);line-height:1.1}
.gloss{font-weight:600;color:var(--muted);margin-bottom:20px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choices--4{grid-template-columns:repeat(4,1fr)}
.choice{padding:16px 10px;border:var(--border);border-radius:16px;background:var(--bg);font-family:var(--font-ru);font-size:1.3rem;font-weight:800;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .1s;line-height:1.15}
.choice small{display:block;font-family:var(--font-body);font-size:.75rem;font-weight:700;color:var(--muted);margin-top:4px}
.choice:hover{transform:translate(-2px,-2px);background:var(--yellow)}
.choice.ok{background:var(--green)} .choice.bad{background:var(--red);animation:shake .35s}
.choice:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:1.8em;margin:16px 0 4px;font-weight:700;font-size:1.05rem}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.toggle-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.answer{width:100%;max-width:380px;padding:14px 20px;border:var(--border);border-radius:16px;font-family:var(--font-ru);font-size:1.6rem;font-weight:800;text-align:center;outline:none;background:var(--bg)}
.answer:focus{background:#fffbe0}
.answer.ok{background:var(--green)} .answer.bad{background:var(--red);animation:shake .35s}
.kbd{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:22px}
.kbd__row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.key{min-width:36px;height:40px;padding:0 6px;border:2px solid var(--ink);border-radius:9px;background:var(--bg);font-family:var(--font-ru);font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.key:active{transform:translate(2px,2px);box-shadow:none}
.key--wide{min-width:70px;background:var(--pink)}
.sentence{font-family:var(--font-ru);font-size:clamp(1.7rem,6vw,2.6rem);font-weight:900;line-height:1.25;margin:8px 0}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--ink);line-height:1;color:transparent}
.blank.filled{color:var(--ink);background:var(--green);border-radius:8px 8px 0 0;padding:0 8px}
.odd{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.odd .choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px}
.odd .choice .e{font-size:2.4rem;line-height:1}

.flip{perspective:1200px;width:min(440px,100%);margin:0 auto;aspect-ratio:4/3;cursor:pointer}
.flip__inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.is-flipped .flip__inner{transform:rotateY(180deg)}
.flip__face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;border:var(--border);border-radius:24px;box-shadow:var(--shadow-lg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip__front{background:var(--gc,var(--pink))}
.flip__back{background:var(--surface);transform:rotateY(180deg)}
.flip__big{font-family:var(--font-ru);font-weight:900;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1;text-align:center}
.flip__hint{font-weight:700;font-size:.9rem;opacity:.7}
.mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:var(--font-ru);font-weight:700}
.mini span{padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);font-size:.95rem}

.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mcard{aspect-ratio:1/1;perspective:800px;cursor:pointer;border:0;background:none;padding:0}
.mcard__inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.up .mcard__inner{transform:rotateY(180deg)}
.mcard__face{position:absolute;inset:0;display:grid;place-items:center;padding:6px;border:var(--border);border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow-sm);font-weight:800;line-height:1.1;text-align:center;font-size:clamp(.85rem,2.8vw,1.2rem)}
.mcard__back{background:var(--ink);color:var(--green);font-family:var(--font-display);font-size:2rem}
.mcard__front{background:var(--surface);transform:rotateY(180deg);font-size:clamp(2rem,7vw,3rem)}
.mcard__front.ru{font-family:var(--font-ru);background:var(--yellow);font-size:clamp(.85rem,2.8vw,1.2rem)}
.mcard.done .mcard__front{background:var(--green)}
.mcard.done{animation:bump .4s}

.result__big{font-family:var(--font-display);font-weight:800;font-size:clamp(3.5rem,14vw,7rem);line-height:.9;letter-spacing:-.05em;margin:6px 0}
.result__msg{font-family:var(--font-ru);font-weight:800;font-size:1.5rem;margin:6px 0 4px}
.review{margin:18px auto 0;text-align:left;max-width:420px;display:flex;flex-direction:column;gap:6px}
.review div{padding:6px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--bg);font-family:var(--font-ru);font-weight:600}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:28px;text-align:left}
.rule{padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--gc);font-weight:600;font-size:.92rem}
.rule b{display:block;font-family:var(--font-ru);font-size:1.2rem}

.footer{border-top:var(--border);padding:28px 0;text-align:center;font-weight:600}
.burst{position:fixed;z-index:99;pointer-events:none;font-size:1.6rem;font-weight:900;animation:fly 1.3s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

@media (max-width:760px){
  .hero{flex-direction:column;align-items:flex-start;gap:40px;padding:28px 22px}
  .hero__avatar{width:180px;font-size:6rem}
  .stage{padding:22px 16px}
  .choices{grid-template-columns:1fr}
  .choices--4{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:1fr}
  .mem{gap:8px}
  .nav{order:3;width:100%}
}

.brand{background:var(--green)}
.xp{background:var(--yellow)}
.marquee{color:var(--green)}
.hero__avatar{background:linear-gradient(135deg,var(--green),var(--yellow));font-size:5.4rem;font-family:var(--font-display);text-align:center;line-height:1}
.hero__title{font-size:clamp(3.6rem,11vw,7.6rem)}
.subhead{font-family:var(--font-display);font-weight:800;font-size:clamp(1.8rem,4.5vw,2.6rem);letter-spacing:-.03em;margin:0 0 12px;line-height:1}
.rule125{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px}
.r1{padding:22px;border:var(--border);border-radius:22px;background:var(--gc);box-shadow:var(--shadow-lg)}
.r1:nth-child(1){transform:rotate(-1deg)} .r1:nth-child(3){transform:rotate(1deg)}
.r1 .n{font-family:var(--font-display);font-weight:800;font-size:2.6rem;line-height:1}
.r1 h3{margin:6px 0 4px;font-family:var(--font-display);font-weight:800;font-size:1.25rem}
.r1 p{margin:4px 0;font-weight:600}
.r1 .ex{font-family:var(--font-ru);font-weight:800;font-size:1.1rem}
.r1 .ex b{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:0 4px}
.box{padding:22px;border:var(--border);border-radius:22px;background:var(--gc,var(--surface));box-shadow:var(--shadow-lg)}
.box h3{margin:0 0 8px;font-family:var(--font-display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1.05}
.box p,.box li{font-weight:600}
.box ul{padding-left:20px;margin:8px 0}
.box .ex{font-family:var(--font-ru);font-weight:800;margin:6px 0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:40px}
.lab{padding:26px;border:var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-lg);margin-bottom:40px;text-align:center}

.lab .out .nn{background:var(--gc);border:var(--border);border-radius:14px;padding:2px 12px;display:inline-block;margin:3px}

.numgrid span{font-family:var(--font-ru);font-weight:800}
.tablewrap{overflow-x:auto;border:var(--border);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:40px}
.tablewrap table{border-collapse:collapse;width:100%;min-width:600px}
.tablewrap th,.tablewrap td{padding:9px 12px;border-bottom:2px solid var(--ink);text-align:left}
.tablewrap tr:last-child td{border-bottom:0}
.tablewrap th{background:var(--yellow);font-family:var(--font-display);font-size:.95rem}
.tablewrap td.ru{font-family:var(--font-ru);font-weight:800;font-size:1.05rem}
/* shop */
.shop{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:start}
.counter{padding:22px;border:var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-lg)}
.awning{height:26px;margin:-22px -22px 18px;border-bottom:var(--border);border-radius:21px 21px 0 0;background:repeating-linear-gradient(90deg,var(--pink) 0 34px,var(--surface) 34px 68px)}
.shopname{font-family:var(--font-ru);font-weight:900;font-size:1.5rem;text-align:center;margin:0 0 10px}
.bubble{position:relative;padding:14px 18px;border:var(--border);border-radius:18px;background:var(--yellow);font-family:var(--font-ru);font-weight:800;font-size:1.15rem;margin:0 0 16px 56px;box-shadow:3px 3px 0 var(--ink)}
.bubble::before{content:attr(data-who);position:absolute;left:-58px;top:-4px;font-size:2.6rem}
.bubble.me{background:var(--blue);margin:0 56px 16px 0;text-align:right}

.need{display:flex;align-items:center;gap:14px;justify-content:center;margin:6px 0 14px;flex-wrap:wrap}
.need .big{font-size:3rem;line-height:1}

.need .en{font-weight:700}
.side{display:flex;flex-direction:column;gap:16px}
.list,.basket{padding:18px;border:var(--border);border-radius:20px;background:#fffbe0;box-shadow:var(--shadow-sm)}
.list h4,.basket h4{margin:0 0 8px;font-family:var(--font-display);font-weight:800;font-size:1.15rem}
.list li{font-weight:700;margin:4px 0}
.list li.done{text-decoration:line-through;opacity:.55}
.basket{background:var(--surface)}
.bline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--ink);font-family:var(--font-ru);font-weight:700}
.bline:last-of-type{border-bottom:0}
.total{margin-top:8px;padding-top:8px;border-top:3px solid var(--ink);display:flex;justify-content:space-between;font-family:var(--font-display);font-weight:800;font-size:1.3rem}

.price{display:inline-block;padding:8px 22px;border:var(--border);border-radius:14px;background:var(--yellow);font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,9vw,3.6rem);box-shadow:var(--shadow);transform:rotate(-3deg)}
.rush__time{font-family:var(--font-display);font-weight:800;font-size:3.2rem;line-height:1}

<script>
/* ============ DATA ============
 An apostrophe ' after a Cyrillic vowel = stress mark.
 noun | gender | 1 (nom. sg) | 2-4 (gen. sg) | 5+ (gen. pl) | english | emoji | price ₽ (shop items only) | shelf */
const S=s=>s.replace(/([аеиоуыэюяё])'/gi,'$1́');
const plain=s=>s.replace(/́/g,'');
const RAW=`
я'блоко|n|я'блоко|я'блока|я'блок|apple|🍎|30|food
бана'н|m|бана'н|бана'на|бана'нов|banana|🍌|25|food
апельси'н|m|апельси'н|апельси'на|апельси'нов|orange|🍊|40|food
лимо'н|m|лимо'н|лимо'на|лимо'нов|lemon|🍋|50|food
помидо'р|m|помидо'р|помидо'ра|помидо'ров|tomato|🍅|20|food
огуре'ц|m|огуре'ц|огурца'|огурцо'в|cucumber|🥒|35|food
яйцо'|n|яйцо'|яйца'|яи'ц|egg|🥚|12|food
буты'лка воды'|f|буты'лка воды'|буты'лки воды'|буты'лок воды'|bottle of water|💧|60|food
бато'н|m|бато'н|бато'на|бато'нов|loaf of bread|🥖|55|food
пиро'г|m|пиро'г|пирога'|пирого'в|pie|🥧|150|food
торт|m|торт|то'рта|то'ртов|cake|🎂|900|food
ру'чка|f|ру'чка|ру'чки|ру'чек|pen|🖊️|45|school
каранда'ш|m|каранда'ш|карандаша'|карандаше'й|pencil|✏️|20|school
тетра'дь|f|тетра'дь|тетра'ди|тетра'дей|notebook|📓|70|school
кни'га|f|кни'га|кни'ги|книг|book|📕|450|school
биле'т|m|биле'т|биле'та|биле'тов|ticket|🎫|350|school
ча'шка|f|ча'шка|ча'шки|ча'шек|cup|☕|300|gift
таре'лка|f|таре'лка|таре'лки|таре'лок|plate|🍽️|250|gift
футбо'лка|f|футбо'лка|футбо'лки|футбо'лок|T-shirt|👕|800|gift
ша'пка|f|ша'пка|ша'пки|ша'пок|hat|🧢|1200|gift
носо'к|m|носо'к|носка'|носко'в|sock|🧦|100|gift
мяч|m|мяч|мяча'|мяче'й|ball|⚽|600|gift
ро'за|f|ро'за|ро'зы|роз|rose|🌹|200|gift
игру'шка|f|игру'шка|игру'шки|игру'шек|toy|🧸|500|gift
матрёшка|f|матрёшка|матрёшки|матрёшек|matryoshka doll|🪆|1500|gift
пла'тье|n|пла'тье|пла'тья|пла'тьев|dress|👗|3500|gift
кольцо'|n|кольцо'|кольца'|коле'ц|ring|💍|5000|gift
стол|m|стол|стола'|столо'в|table|🪵||
дом|m|дом|до'ма|домо'в|house|🏠||
брат|m|брат|бра'та|бра'тьев|brother|👦||
сестра'|f|сестра'|сестры'|сестёр|sister|👧||
окно'|n|окно'|окна'|о'кон|window|🪟||
студе'нт|m|студе'нт|студе'нта|студе'нтов|student|🧑‍🎓||
ко'шка|f|ко'шка|ко'шки|ко'шек|cat|🐱||
день|m|день|дня|дней|day|🌞||
час|m|час|часа'|часо'в|hour|🕐||
мину'та|f|мину'та|мину'ты|мину'т|minute|⏱️||
неде'ля|f|неде'ля|неде'ли|неде'ль|week|📅||
челове'к|m|челове'к|челове'ка|челове'к|person|🧍||
год|m|год|го'да|лет|year|🎂||
рубль|m|рубль|рубля'|рубле'й|rouble|💰||
`;
const N=RAW.trim().split('\n').map((l,id)=>{const [w,g,a,b,c,en,e,price,shelf]=l.split('|');
  const f=[S(a),S(b),S(c)];
  /* accusative singular (only feminine changes): -а → -у, -я → -ю */
  const acc=g==='f'?f[0].replace(/^(\S+?)а(́?)(\s|$)/,'$1у$2$3').replace(/^(\S+?)я(́?)(\s|$)/,'$1ю$2$3'):f[0];
  return {id,w:S(w),g,f,acc,en,e,price:+price||0,shelf};});
const SHOP=N.filter(n=>n.price);
const RUB=N.find(n=>plain(n.w)==='рубль'),YEAR=N.find(n=>plain(n.w)==='год');
const SHELVES={food:'🍎 Food',school:'✏️ Stationery',gift:'🎁 Gifts & clothes'};

/* ============ NUMBERS → WORDS ============ */
const UNITS=["ноль","оди'н","два","три","четы'ре","пять","шесть","семь","во'семь","де'вять"].map(S);
const TEENS=["де'сять","оди'ннадцать","двена'дцать","трина'дцать","четы'рнадцать","пятна'дцать","шестна'дцать","семна'дцать","восемна'дцать","девятна'дцать"].map(S);
const TENS=["","","два'дцать","три'дцать","со'рок","пятьдеся'т","шестьдеся'т","се'мьдесят","во'семьдесят","девяно'сто"].map(S);
const HUND=["","сто","две'сти","три'ста","четы'реста","пятьсо'т","шестьсо'т","семьсо'т","восемьсо'т","девятьсо'т"].map(S);
const THOU=["ты'сяча","ты'сячи","ты'сяч"].map(S);
function unit(u,g,acc){
  if(u===1)return g==='f'?(acc?S("одну'"):S("одна'")):g==='n'?S("одно'"):UNITS[1];
  if(u===2)return g==='f'?'две':'два';
  return UNITS[u];
}
function under1000(n,g,acc){
  const out=[],h=Math.floor(n/100),r=n%100;
  if(h)out.push(HUND[h]);
  if(r>=10&&r<20)out.push(TEENS[r-10]);
  else{const t=Math.floor(r/10),u=r%10;if(t)out.push(TENS[t]);if(u)out.push(unit(u,g,acc));}
  return out.join(' ');
}
/* which form? 0 = оди́н стол, 1 = два стола́, 2 = пять столо́в */
function formIdx(n){const r=n%100,u=n%10;if(r>=11&&r<=14)return 2;if(u===1)return 0;if(u>=2&&u<=4)return 1;return 2;}
function words(n,g='m',acc=false){
  if(n===0)return UNITS[0];
  const th=Math.floor(n/1000),r=n%1000,out=[];
  if(th)out.push(th===1?THOU[0]:under1000(th,'f')+' '+THOU[formIdx(th)]);
  if(r)out.push(under1000(r,g,acc));
  return out.join(' ');
}
/* the full phrase: "два стола́"; in a shop (acc) feminine one → одну́ ру́чку */
function phrase(n,noun,acc=false){
  const k=formIdx(n);const nw=words(n,noun.g,acc);
  const nf=(k===0&&acc)?noun.acc:noun.f[k];
  return nw+' '+nf;
}
const rubles=n=>`${words(n)} ${RUB.f[formIdx(n)]}`;
const WHY=["ends in 1 (not 11) → nominative singular","ends in 2, 3 or 4 (not 12–14) → genitive singular","ends in 0 or 5–9, or in 11–14 → genitive plural"];

/* ============ HELPERS ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const fmt=n=>n.toLocaleString('ru-RU').replace(/ /g,' ');
const store={get(k,d){try{const v=localStorage.getItem('ng2_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ng2_'+k,JSON.stringify(v))}catch(e){}}};
let xp=store.get('xp',0);
function addXP(n){xp+=n;store.set('xp',xp);const el=$('#xp');el.textContent='★ '+xp+' XP';el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
function burst(){
  const cols=['#fe98c0','#80eb3d','#3dd0eb','#eb583d','#ffe14d'];
  for(let i=0;i<26;i++){const s=document.createElement('span');s.className='burst';s.textContent=pick(['✦','★','●','₽']);
    s.style.left=(innerWidth/2)+'px';s.style.top=(innerHeight/2)+'px';s.style.color=pick(cols);
    s.style.setProperty('--dx',(Math.random()*700-350)+'px');s.style.setProperty('--dy',(Math.random()*600-380)+'px');s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1400);}
}
function resultMsg(r){return S(r>=.9?"Отли'чно!":r>=.7?"Хорошо'!":r>=.4?"Неплохо'!":"Ещё раз!");}
function results(el,score,total,review,again){
  const r=score/total;if(r>=.7)burst();addXP(score);
  el.innerHTML=`<div class="stage stage--pink"><p class="result__msg">${resultMsg(r)}</p><div class="result__big">${score}/${total}</div>
    ${review.length?`<p><b>Review these:</b></p><div class="review">${review.map(x=>`<div>${x}</div>`).join('')}</div>`:'<p><b>Perfect round!</b></p>'}
    <div class="actions"><button class="btn btn--ghost" id="again">New round</button></div></div>`;
  $('#again').onclick=again;
}
function mcRound({stage,id,total,make,render}){
  let i=0,score=0,review=[],qs=make();const n=()=>Math.min(total,qs.length);
  const next=()=>{
    $('#'+id+'Score').textContent=`${score} / ${n()}`;$('#'+id+'Fill').style.width=(i/n()*100)+'%';
    if(i>=n()){results($(stage),score,n(),review,()=>{i=0;score=0;review=[];qs=make();next();});return;}
    render(qs[i],i,i===n()-1,(ok,rev)=>{if(ok)score++;else if(rev)review.push(rev);$('#'+id+'Score').textContent=`${score} / ${n()}`;},()=>{i++;next();});
  };
  next();
}
function wireChoices(isRight,onAnswer,root=document){
  $$('.choice',root).forEach(b=>b.onclick=()=>{
    if(b.disabled)return;const ok=isRight(b);
    $$('.choice',root).forEach(x=>{x.disabled=true;if(isRight(x))x.classList.add('ok');});
    if(!ok)b.classList.add('bad');
    onAnswer(ok);
    const nw=$('#nextWrap');if(nw){nw.style.visibility='visible';$('#nextBtn').focus();}
  });
}
const nextBtn=last=>`<div class="actions" id="nextWrap" style="visibility:hidden"><button class="btn btn--green" id="nextBtn">${last?'Results →':'Next →'}</button></div>`;
const bar=id=>`<div class="game__bar"><div class="progress"><div class="progress__fill" id="${id}Fill"></div></div><span class="score" id="${id}Score"></span></div>`;
function keyChoices(){const key=e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const k=+e.key;if(k>=1&&k<=4){const b=$$('.choice')[k-1];if(b&&!b.disabled)b.click();}else if(e.key==='Enter'){const nb=$('#nextBtn');if(nb&&$('#nextWrap').style.visibility==='visible'){e.preventDefault();nb.click();}}};document.addEventListener('keydown',key);cleanup=()=>document.removeEventListener('keydown',key);}
/* numbers learners often confuse */
function confusable(n){
  const c=new Set();
  const add=x=>{if(x>=0&&x<=9999&&x!==n)c.add(x);};
  if(n>=11&&n<=19){add((n-10)*10);add(n-10);}
  if(n%10===0&&n>=20&&n<100){add(n/10+10);add(n/10);}
  if(n<100){add(n+10);add(n-10);add(n+1);}
  else{add(n+100);add(n-100);add(n+10);add(n-10);const s=String(n).split('').reverse().join('');add(+s);}
  while(c.size<3)add(n+rnd(-20,20));
  return shuffle([...c]).slice(0,3);
}

/* ============ ROUTER ============ */
let route='home',cleanup=null;const VIEWS={};
function go(){
  if(cleanup){cleanup();cleanup=null;}
  const h=location.hash.slice(1);route=VIEWS[h]?h:'home';
  $$('.nav__link').forEach(a=>a.classList.toggle('is-active',a.getAttribute('href')==='#'+route));
  VIEWS[route]($('#view'));scrollTo(0,0);
}
addEventListener('hashchange',go);
function shell(el,title,sub,inner){el.innerHTML=S(`<section class="section"><div class="container"><h1 class="heading">${title}</h1><p class="lead">${sub}</p>${inner}</div></section>`);}
$('#modalClose').onclick=()=>$('#modal').classList.remove('is-open');

/* ============ HOME ============ */
const MODES=[
  ['numbers','🔢','Numbers','0 to 9 999 in words, with a converter for any number.','var(--yellow)'],
  ['rule','📐','The 1 · 2 · 5 rule','оди́н стол, два стола́, пять столо́в: which form after which number.','var(--green)'],
  ['money','💰','Money & age','рубль / рубля́ / рубле́й, год / го́да / лет, and how to shop politely.','var(--pink)'],
  ['nouns','📖','Noun list',`${N.length} nouns in all three forms.`,'var(--blue)'],
  ['shop','🛒','The shop','Order items with the right form, then pay the total said in words!','var(--red)'],
  ['form','🧩','1, 2 or 5?','See a number and a noun, pick the right form. Watch out for 11–14!','var(--lilac)'],
  ['words','✍️','Number words','Digits to words and words to digits.','var(--yellow)'],
  ['price','🏷️','Price check','60 seconds: read the price tag and pick the right words.','var(--green)'],
  ['age','🎂','How old?','Мне два́дцать оди́н год, ему́ три́дцать лет: год, го́да or лет?','var(--pink)'],
  ['memory','🧠','Memory match','Pair digits with number words.','var(--blue)']
];
VIEWS.home=el=>{
  const ex=shuffle(SHOP).slice(0,10).map(n=>{const q=pick([1,2,3,5,21,22,25]);return `${n.e} ${phrase(q,n)}`;});
  const track=`<div class="marquee__track" aria-hidden="true">${ex.map(w=>`<span>${esc(w)}</span><span class="marquee__star">✦</span>`).join('')}</div>`;
  el.innerHTML=`
  <section class="hero-wrap"><div class="container"><div class="hero">
    <div class="hero__media">
      <div class="hero__avatar" style="font-size:8.5rem">67</div>
      <span class="hero__sticker2">${S("пять столо'в")}</span>
      <span class="hero__sticker">A1 ✦ A2</span>
    </div>

/* ============ THE 1-2-5 RULE ============ */
VIEWS.rule=el=>{
  const st=N.find(n=>plain(n.w)==='стол'),kn=N.find(n=>plain(n.w)==='книга'),ok=N.find(n=>plain(n.w)==='окно');
  shell(el,'The 1 · 2 · 5 rule','After a number, the noun takes one of <b>three forms</b>. Which one? Just look at the <b>last digit</b> (and watch out for 11–14).',`
    <div class="rule125">
      <div class="r1" style="--gc:var(--yellow)"><span class="n">1</span><h3>Nominative singular</h3><p>1, 21, 31, 101…</p>
        <p class="ex">оди'н <b>${st.f[0]}</b></p><p class="ex">одна' <b>${kn.f[0]}</b></p><p class="ex">два'дцать одно' <b>${ok.f[0]}</b></p></div>
      <div class="r1" style="--gc:var(--green)"><span class="n">2 3 4</span><h3>Genitive singular</h3><p>2–4, 22–24, 32–34…</p>
        <p class="ex">два <b>${st.f[1]}</b></p><p class="ex">три <b>${kn.f[1]}</b></p><p class="ex">четы'ре <b>${ok.f[1]}</b></p></div>
      <div class="r1" style="--gc:var(--pink)"><span class="n">5+</span><h3>Genitive plural</h3><p>0, 5–20, 25–30… and 11–14!</p>
        <p class="ex">пять <b>${st.f[2]}</b></p><p class="ex">оди'ннадцать <b>${kn.f[2]}</b></p><p class="ex">сто <b>${ok.f[2]}</b></p></div>
    </div>
    <h2 class="subhead">Try it: the number lab</h2>
    <div class="lab">
      <select id="lNoun">${N.map(n=>`<option value="${n.id}">${n.e} ${n.w} · ${n.en}</option>`).join('')}</select>
      <div><input type="range" id="lRange" min="0" max="125" value="22"></div>
      <div class="out" id="lOut"></div><div class="why" id="lWhy"></div>
    </div>
    <div class="duo">
      <div class="box" style="--gc:var(--blue)"><h3>🔢 The 11–14 exception</h3><p>11, 12, 13, 14 end in 1–4 but always take the <b>5+ form</b>:</p>
        <p class="ex">оди'ннадцать столо'в · двена'дцать книг · 112 рубле'й</p><p>But 21, 22 follow the last digit again: <span class="ru"><b>два'дцать два стола'</b></span>.</p></div>
      <div class="box" style="--gc:var(--lilac)"><h3>📦 мно'го, ма'ло, ско'лько</h3><p>Things you can count take the <b>genitive plural</b>, like 5+:</p>
        <p class="ex">мно'го книг · ма'ло друзе'й · Ско'лько у тебя' бра'тьев?</p>
        <p>Things you can’t count take the <b>genitive singular</b>: <span class="ru"><b>мно'го воды' · ма'ло вре'мени</b></span>.</p></div>
    </div>
    <div class="actions"><a class="btn btn--green" href="#form">Practise: 1, 2 or 5? →</a><a class="btn btn--ghost" href="#money">Next: Money &amp; age</a></div>`);
  const upd=()=>{const n=+$('#lRange').value,no=N[+$('#lNoun').value],k=formIdx(n);
    $('#lOut').innerHTML=`<span style="font-family:var(--font-display);font-size:.8em">${n}</span> <span class="nw">${esc(words(n,no.g))}</span> <span class="nn" style="--gc:${['var(--yellow)','var(--green)','var(--pink)'][k]}">${esc(no.f[k])}</span>`;
    $('#lWhy').textContent=`${n} ${WHY[k]}`;};
  $('#lRange').oninput=upd;$('#lNoun').onchange=upd;upd();
};

/* ============ THE SHOP ============ */
VIEWS.shop=el=>{
  let wallet=store.get('wallet',10000),served=0,points=0;
  shell(el,'🛒 The shop','You’re a customer. Read your shopping list, ask for each item with the right form, then pay the total. Each customer you serve without a mistake earns ⭐!',`
    <div class="shop">
      <div class="counter"><div class="awning"></div><p class="shopname">${S("Магази'н «Всё для всех»")}</p><div id="talk"></div></div>
      <div class="side">
        <div class="wallet"><span>👛 Wallet</span><span id="wal"></span></div>
        <div class="list"><h4>📝 Shopping list</h4><ul id="list" style="margin:0;padding-left:20px"></ul></div>
        <div class="basket"><h4>🧺 Basket</h4><div id="basket"></div><div class="total"><span>Total</span><span id="tot">0 ₽</span></div></div>
        <div class="wallet" style="background:var(--yellow)"><span>⭐ Customers served</span><span id="srv">0</span></div>
      </div>
    </div>`);
  let order,step,basket,mistakes;
  const QTY=[1,1,2,2,3,3,4,5,5,6,7,10,12,21,22];
  const updSide=()=>{
    $('#wal').textContent=fmt(wallet)+' ₽';$('#srv').textContent=served;
    $('#list').innerHTML=order.map((o,k)=>`<li class="${k<step?'done':''}">${o.n.e} ${o.q} × ${esc(o.n.en)}${o.q>1?'s':''}</li>`).join('');
    $('#basket').innerHTML=basket.length?basket.map(b=>`<div class="bline"><span>${esc(b.ph)}</span><span>${fmt(b.cost)} ₽</span></div>`).join(''):'<p class="muted" style="margin:0;font-weight:600">Empty</p>';
    $('#tot').textContent=fmt(basket.reduce((s,b)=>s+b.cost,0))+' ₽';
  };
  const newCustomer=()=>{
    const items=shuffle(SHOP.filter(n=>n.price<=1500)).slice(0,rnd(2,3));
    order=items.map(n=>{let q=pick(QTY);if(n.price*q>3000)q=pick([1,2,3]);return {n,q};});
    step=0;basket=[];mistakes=0;updSide();ask();
  };
  const ask=()=>{
    const o=order[step],right=S("Мне, пожа'луйста, ")+phrase(o.q,o.n,true)+'.';
    const opts=new Set([right]);
    const k=formIdx(o.q);
    [0,1,2].filter(j=>j!==k).forEach(j=>opts.add(S("Мне, пожа'луйста, ")+words(o.q,o.n.g,true)+' '+o.n.f[j]+'.'));
    if(o.q%10===1&&o.q%100!==11&&o.n.g==='f')opts.add(S("Мне, пожа'луйста, ")+words(o.q,'f',false)+' '+o.n.f[0]+'.');
    if(o.q%10<=2&&o.q%10>0&&o.q%100!==11&&o.q%100!==12)opts.add(S("Мне, пожа'луйста, ")+words(o.q,o.n.g==='f'?'m':'f',true)+' '+(k===0&&o.n.g!=='f'?o.n.acc:o.n.f[k])+'.');
    const list=shuffle([...opts].slice(0,4));if(!list.includes(right)){list[0]=right;}
    $('#talk').innerHTML=`
      <div class="bubble" data-who="🧑‍💼">${S(step?"Что ещё?":"Здра'вствуйте! Что вам?")}</div>
      <div class="need"><span class="big">${o.n.e}</span><span class="qty">${o.q}</span><span class="en">× ${esc(o.n.en)}${o.q>1?'s':''} · ${fmt(o.n.price)} ₽ each</span></div>
      <p class="label" style="text-align:center">You say:</p>
      <div class="choices" style="grid-template-columns:1fr">${shuffle(list).map(x=>`<button class="choice" data-o="${esc(x)}" style="font-size:1.1rem;text-align:left">${esc(x)}</button>`).join('')}</div>
      <div class="feedback" id="fb" style="text-align:center"></div>
      <div class="actions" id="shopNext" style="visibility:hidden"><button class="btn btn--green" id="sn">Next →</button></div>`;
    wireChoices(b=>b.dataset.o===right,ok=>{
      if(!ok)mistakes++;
      const f=formIdx(o.q);
      $('#fb').innerHTML=ok?`${S("Ве'рно!")} ✦ ${o.q} ${WHY[f]}`:`Correct: <span class="ru">${esc(phrase(o.q,o.n,true))}</span> · ${o.q} ${WHY[f]}${f===0&&o.n.g==='f'?' (and feminine “one” → одну́ + -у)':''}`;
      basket.push({ph:`${o.n.e} ${phrase(o.q,o.n)}`,cost:o.q*o.n.price});updSide();
      $('#shopNext').style.visibility='visible';$('#sn').focus();
      $('#sn').onclick=()=>{step++;updSide();step<order.length?ask():pay();};
    },$('#talk'));
  };
  const pay=()=>{
    const total=basket.reduce((s,b)=>s+b.cost,0);
    const mode=Math.random()<.5?'read':'say';
    const wrongN=confusable(total).filter(x=>x>0);
    if(mode==='read'){
      const opts=shuffle([total,...wrongN]);
      $('#talk').innerHTML=`<div class="bubble" data-who="🧑‍💼">${S("С вас")} ${esc(rubles(total))}.</div>
        <p class="label" style="text-align:center">How much do you pay?</p>
        <div class="choices">${opts.map(x=>`<button class="choice" data-o="${x}"><span class="note-bill">💵 ${fmt(x)} ₽</span></button>`).join('')}</div>
        <div class="feedback" id="fb" style="text-align:center"></div><div class="actions" id="shopNext" style="visibility:hidden"><button class="btn btn--green" id="sn">Next customer →</button></div>`;
    }else{
      const opts=new Set([rubles(total)]);
      opts.add(`${words(total)} ${RUB.f[(formIdx(total)+1)%3]}`);
      wrongN.forEach(x=>opts.size<4&&opts.add(rubles(x)));
      $('#talk').innerHTML=`<div class="bubble me" data-who="🙋">${S("Ско'лько с меня'?")}</div>
        <div style="text-align:center;margin:10px 0 18px"><span class="price">${fmt(total)} ₽</span></div>
        <p class="label" style="text-align:center">What does the shop assistant say? “С вас…”</p>
        <div class="choices" style="grid-template-columns:1fr">${shuffle([...opts]).map(x=>`<button class="choice" data-o="${esc(x)}" style="font-size:1.1rem">${esc(x)}</button>`).join('')}</div>
        <div class="feedback" id="fb" style="text-align:center"></div><div class="actions" id="shopNext" style="visibility:hidden"><button class="btn btn--green" id="sn">Next customer →</button></div>`;
    }
    wireChoices(b=>mode==='read'?+b.dataset.o===total:b.dataset.o===rubles(total),ok=>{
      if(!ok)mistakes++;
      wallet-=total;if(wallet<0)wallet+=20000;store.set('wallet',wallet);
      if(!mistakes){served++;addXP(5);burst();}else addXP(2);
      $('#fb').innerHTML=`${ok?S("Спаси'бо! "):''}<span class="ru">${S("С вас")} ${esc(rubles(total))}</span> = ${fmt(total)} ₽ · ${WHY[formIdx(total)].split('→')[1]} → ${RUB.f[formIdx(total)]}${mistakes?'':' · ⭐ perfect customer!'}`;
      updSide();$('#shopNext').style.visibility='visible';$('#sn').focus();
      $('#sn').onclick=newCustomer;
    },$('#talk'));
  };
  newCustomer();
};

/* ============ GAME: number words ============ */
VIEWS.words=el=>{
  let mode='d2w';
  shell(el,'Number words','Digits → words (multiple choice) or words → digits (type it). Keys 1–4.',`
    <div class="game"><div class="toggle-row"><button class="btn btn--sm" data-m="d2w">123 → words</button><button class="btn btn--sm btn--ghost" data-m="w2d">words → 123</button></div>${bar('nw')}<div id="nwStage"></div></div>`);
  const gen=()=>pick([rnd(0,20),rnd(20,99),rnd(20,99),rnd(100,999),rnd(100,999),rnd(1000,9999)]);
  const run=()=>mcRound({stage:'#nwStage',id:'nw',total:12,make:()=>Array.from({length:12},gen),render:(n,i,last,answer,next)=>{
    if(mode==='d2w'){
      const opts=shuffle([n,...confusable(n)]);
      $('#nwStage').innerHTML=`<div class="stage"><div style="margin:10px 0 22px"><span class="price">${fmt(n)}</span></div>
        <div class="choices" style="grid-template-columns:1fr">${opts.map((x,j)=>`<button class="choice" data-o="${x}" style="font-size:1.15rem">${esc(words(x))}<small>${j+1}</small></button>`).join('')}</div>
        <div class="feedback" id="fb"></div>${nextBtn(last)}</div>`;
      wireChoices(b=>+b.dataset.o===n,ok=>{answer(ok,`${fmt(n)} = ${esc(words(n))}`);$('#fb').innerHTML=`${fmt(n)} = <span class="ru">${esc(words(n))}</span>`;});
    }else{
      $('#nwStage').innerHTML=`<div class="stage"><p class="sentence">${esc(words(n))}</p>
        <input class="answer" id="nwIn" type="text" inputmode="numeric" placeholder="123" autocomplete="off">
        <div class="feedback" id="fb"></div><div class="actions"><button class="btn btn--green" id="go">Check ↵</button></div>${nextBtn(last)}</div>`;
      const inp=$('#nwIn');inp.focus();let done=false;
      const check=()=>{if(done){return;}if(!inp.value.trim())return;done=true;inp.readOnly=true;const ok=parseInt(inp.value.replace(/\D/g,''))===n;
        inp.classList.add(ok?'ok':'bad');answer(ok,`${esc(words(n))} = <b>${fmt(n)}</b>`);$('#fb').innerHTML=ok?S("Ве'рно! ✦"):`Correct: <b>${fmt(n)}</b>`;
        $('#go').style.display='none';$('#nextWrap').style.visibility='visible';$('#nextBtn').focus();};
      inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done?$('#nextBtn').click():check();}};$('#go').onclick=check;
    }
    $('#nextBtn').onclick=next;
  }});
  $$('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('[data-m]').forEach(x=>x.classList.toggle('btn--ghost',x!==b));run();});
  run();keyChoices();
};

/* ============ GAME: price check (60s) ============ */
VIEWS.price=el=>{
  let timer,left,score,streak,best=store.get('priceBest',0),cur,running=false;
  shell(el,'Price check','60 seconds! Read the price tag and tap the right words, with the right form of рубль. Keys 1–3.',`<div class="game"><div id="pcStage"></div></div>`);
  const intro=()=>{$('#pcStage').innerHTML=`<div class="stage stage--pink"><div class="result__big">60s</div><p class="result__msg">${S("Гото'вы?")}</p><p><b>Best score: ${best}</b></p><div class="actions"><button class="btn btn--green" id="pcGo">Start ⚡</button></div></div>`;$('#pcGo').onclick=start;};
  const next=()=>{
    const n=pick([rnd(1,30),rnd(1,99),rnd(100,999),rnd(100,999),rnd(1000,5000)]);
    const right=rubles(n);const opts=new Set([right,`${words(n)} ${RUB.f[(formIdx(n)+pick([1,2]))%3]}`]);
    for(const x of confusable(n)){if(opts.size>=3)break;if(x>0)opts.add(rubles(x));}
    cur={n,right};
    $('#pcTag').textContent=fmt(n)+' ₽';
    $('#pcOpts').innerHTML=shuffle([...opts]).map((x,j)=>`<button class="choice" data-o="${esc(x)}" style="font-size:1.1rem">${esc(x)}<small>${j+1}</small></button>`).join('');
    $$('#pcOpts .choice').forEach(b=>b.onclick=()=>answer(b.dataset.o===cur.right));
  };
  const answer=ok=>{
    if(!running)return;if(ok){score++;streak++;}else streak=0;
    $('#pcFb').innerHTML=ok?(streak>=5?`🔥 streak ${streak}!`:'✓'):`✗ ${fmt(cur.n)} ₽ = <span class="ru">${esc(cur.right)}</span>`;
    $('#pcScore').textContent=score;next();
  };
  const start=()=>{
    left=60;score=0;streak=0;running=true;
    $('#pcStage').innerHTML=`<div class="game__bar"><span class="rush__time" id="pcTime">60</span><span class="score">Score: <span id="pcScore">0</span></span></div>
      <div class="progress" style="margin-bottom:16px"><div class="progress__fill" id="pcFill" style="width:100%;background:var(--red)"></div></div>
      <div class="stage"><div style="margin:6px 0 20px"><span class="price" id="pcTag"></span></div>
      <div class="choices" style="grid-template-columns:1fr" id="pcOpts"></div><div class="feedback" id="pcFb"></div></div>`;
    next();
    timer=setInterval(()=>{left--;$('#pcTime').textContent=left;$('#pcFill').style.width=(left/60*100)+'%';if(left<=0)end();},1000);
  };
  const end=()=>{
    clearInterval(timer);running=false;addXP(score);const nb=score>best;if(nb){best=score;store.set('priceBest',best);burst();}
    $('#pcStage').innerHTML=`<div class="stage stage--pink"><p class="result__msg">${S(nb?"Но'вый реко'рд!":"Вре'мя вы'шло!")}</p><div class="result__big">${score}</div><p><b>prices read</b> · best ${best}</p><div class="actions"><button class="btn btn--green" id="pcGo">Go again ⚡</button></div></div>`;
    $('#pcGo').onclick=start;
  };
  const key=e=>{if(!running)return;const k=+e.key;if(k>=1&&k<=3){const b=$$('#pcOpts .choice')[k-1];if(b)b.click();}};
  document.addEventListener('keydown',key);
  cleanup=()=>{clearInterval(timer);running=false;document.removeEventListener('keydown',key);};
  intro();
};

/* ============ GAME: how old ============ */
VIEWS.age=el=>{
  const WHO=[["Мне","I am","🙋"],["Тебе'","you are","🫵"],["Ему'","he is","👨"],["Ей","she is","👩"],["Ба'бушке","Grandma is","👵"],["Па'пе","Dad is","👨‍🦳"],["Ко'шке","the cat is","🐱"],["Бра'ту","my brother is","👦"]].map(r=>[S(r[0]),r[1],r[2]]);
  shell(el,'How old?','год, го́да or лет? Look at the last digit of the age (and remember 11–14!). Keys 1–3.',`<div class="game">${bar('ag')}<div id="agStage"></div></div>`);
  mcRound({stage:'#agStage',id:'ag',total:12,make:()=>Array.from({length:12},()=>{const w=pick(WHO);const a=plain(w[0])==='Кошке'?rnd(1,15):plain(w[0])==='Бабушке'?rnd(60,95):rnd(1,64);return {w,a};}),render:(q,i,last,answer,next)=>{
    const k=formIdx(q.a),right=YEAR.f[k];
    $('#agStage').innerHTML=`<div class="stage"><div style="font-size:3.4rem;line-height:1">${q.w[2]}</div>
      <p class="sentence">${esc(q.w[0])} <span style="font-family:var(--font-display)">${q.a}</span> <span class="blank" id="blank">${esc(right)}</span>.</p>
      <p class="gloss">${cap(q.w[1])} ${q.a} years old. · ${esc(words(q.a))} …</p>
      <div class="choices" style="grid-template-columns:repeat(3,1fr)">${YEAR.f.map((f,j)=>`<button class="choice" data-j="${j}" style="font-size:1.8rem">${esc(f)}<small>${j+1}</small></button>`).join('')}</div>
      <div class="feedback" id="fb"></div>${nextBtn(last)}</div>`;
    wireChoices(b=>+b.dataset.j===k,ok=>{answer(ok,`${esc(q.w[0])} ${q.a} <b>${esc(right)}</b>`);$('#blank').classList.add('filled');
      $('#fb').innerHTML=`<span class="ru">${esc(q.w[0])} ${esc(words(q.a))} ${esc(right)}</span> · ${q.a} ${WHY[k]}`;});
    $('#nextBtn').onclick=next;
  }});
  keyChoices();
};

/* ============ MEMORY ============ */
VIEWS.memory=el=>{
  let cards,open,moves,matched,t0,timer,lock;
  shell(el,'Memory match','Flip two tiles at a time. Pair each number (yellow) with its words (blue).',`
    <div class="game"><div class="game__bar"><span class="score" id="mmMoves">0 moves</span><span class="score" id="mmTime" style="background:var(--blue)">0:00</span><button class="btn btn--sm btn--ghost" id="mmRe">↻ New board</button></div><div id="mmStage"></div></div>`);
  const tf=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const start=()=>{
    clearInterval(timer);
    const ns=new Set();while(ns.size<8)ns.add(pick([rnd(11,19),rnd(20,99),rnd(20,99),rnd(100,999),pick([12,20,15,50,14,40,19,90])]));
    cards=shuffle([...ns].flatMap(n=>[{k:n,t:String(n),d:1},{k:n,t:words(n),d:0}]));
    open=[];moves=0;matched=0;t0=null;lock=false;
    $('#mmMoves').textContent='0 moves';$('#mmTime').textContent='0:00';
    $('#mmStage').innerHTML=`<div class="mem">${cards.map((c,j)=>`<button class="mcard" data-j="${j}" aria-label="Hidden tile"><div class="mcard__inner"><div class="mcard__face mcard__back">✦</div><div class="mcard__face mcard__front ${c.d?'d':'w'}">${esc(c.t)}</div></div></button>`).join('')}</div>`;
    $$('.mcard').forEach(b=>b.onclick=()=>flip(b));
  };
  const flip=b=>{
    if(lock||b.classList.contains('up'))return;
    if(!t0){t0=Date.now();timer=setInterval(()=>$('#mmTime').textContent=tf(Math.floor((Date.now()-t0)/1000)),500);}
    b.classList.add('up');open.push(b);
    if(open.length===2){
      moves++;$('#mmMoves').textContent=moves+' moves';
      const [a,d]=open.map(x=>cards[+x.dataset.j]);
      if(a.k===d.k&&a.d!==d.d){open.forEach(x=>x.classList.add('done'));open=[];matched++;
        if(matched===cards.length/2){clearInterval(timer);addXP(5);burst();
          setTimeout(()=>{$('#mmStage').insertAdjacentHTML('beforeend',`<div class="stage stage--pink" style="margin-top:24px"><p class="result__msg">${S("Молоде'ц!")}</p><div class="result__big">${moves}</div><p><b>moves</b> in ${$('#mmTime').textContent}</p><div class="actions"><button class="btn btn--ghost" id="mmAgain">Play again</button></div></div>`);$('#mmAgain').onclick=start;},450);}
      }else{lock=true;setTimeout(()=>{open.forEach(x=>x.classList.remove('up'));open=[];lock=false;},900);}
    }
  };
  $('#mmRe').onclick=start;cleanup=()=>clearInterval(timer);
  start();
};

/* ============ INIT ============ */
$('#xp').textContent='★ '+xp+' XP';
$('#footRu').textContent=S("Раз, два, три — счита'й и покупа'й!");
go();
</script>
